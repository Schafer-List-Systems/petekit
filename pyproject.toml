[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "petekit"
version = "0.3.12"
description = "PeteOS Kit — agentic building blocks for streams, text, and images"
requires-python = ">=3.10"
dependencies = [
    "peteos",
    "paatch",
    "diff-match-patch",
    "jsonpatch",
    "mss",
    "pytest",
    "pytest-asyncio",
    "setuptools",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "beautifulsoup4",
    "lxml"

]

[project.optional-dependencies]
image = ["opencv-python>=4.8.0", "numpy>=1.24.0", "mss"]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["petekit", "petekit.*"]
